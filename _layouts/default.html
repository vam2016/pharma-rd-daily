<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.summary | default: site.description | escape }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
</head>
<body>
<a class="skip" href="#main">跳转到正文</a>
<header class="site-header"><a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">研</span><span>医药研发<span class="brand-sub">每日简报</span></span></a><nav aria-label="主导航"><a href="{{ '/' | relative_url }}">日报归档</a><a href="{{ '/about/' | relative_url }}">关于简报</a><a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a></nav></header>
<main id="main">{{ content }}</main>
<footer class="site-footer"><span>{{ site.title }} · 公开信息与专业解读</span><span>事实、统计解读与临床价值，分别呈现。</span></footer>
<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
{% if page.layout == 'post' or page.math %}<script src="{{ '/assets/math.js' | relative_url }}" defer></script>{% endif %}
</body></html>
