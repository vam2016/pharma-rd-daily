title: 临床研发统计观察
description: 面向临床研发统计师的研发证据、统计方法与研究笔记
url: "https://vam2016.github.io"
baseurl: "/pharma-rd-daily"
timezone: Asia/Shanghai
lang: zh-CN
markdown: kramdown
kramdown:
  input: Kramdown
  math_engine: mathjax
permalink: /briefs/:year-:month-:day/
future: false
exclude: [README.md, templates, docs, scripts, schemas, Gemfile, Gemfile.lock]
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      section: rd
      format: daily_brief
  - scope:
      path: "_posts/statistics"
      type: posts
    values:
      section: statistics
      format: research_digest
      permalink: /statistics/:year-:month-:day/
  - scope:
      path: "_posts/notes"
      type: posts
    values:
      section: notes
      format: study_note
      permalink: /notes/:title/
